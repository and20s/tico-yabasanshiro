plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.google.firebase.crashlytics")
    id 'org.jetbrains.kotlin.kapt'
    id("jacoco")
}

// Native libs that should never ship in release / pro APKs (debug-only
// tooling, validation layers, etc.).
ext.shippedJniLibsExcludes = ['**/libVkLayer_khronos_validation.so']

android {
    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace "org.devmiyax.yabasanshiro"
    androidResources {
        // Benchmark discs must reach the device byte-for-byte: a compressed asset
        // still opens fine via AssetManager.open(), but there is no reason to pay
        // the (de)compression cost for a 192 KB iso, so keep it stored as-is.
        noCompress += ["iso"]
    }
    signingConfigs {
        debug {
            storeFile file("../debug-yabara.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        pro {
            if( System.getenv('KEY_FILE_NAME') == null ){
                storeFile file("dmy")
            }else {
                storeFile file(System.getenv('KEY_FILE_NAME'))
            }
            storePassword System.getenv('STORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }

        release {
            if( System.getenv('KEY_FILE_NAME') == null ){
                storeFile file("dmy")
            }else {
                storeFile file(System.getenv('KEY_FILE_NAME'))
            }
            storePassword System.getenv('STORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }

    }

    sourceSets {
        test.java.srcDirs += 'src/test/java'
        androidTest.java.srcDirs += 'src/androidTest/java'
        androidTest.assets.srcDirs += 'src/androidTest'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Fix for Robolectric with Java 17
                jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED",
                        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
                        "--add-opens=java.base/java.io=ALL-UNNAMED",
                        "--add-opens=java.base/java.util=ALL-UNNAMED"

                // Set java.library.path to include native libraries for testing
                systemProperty "java.library.path", "${projectDir}/src/main/jniLibs/arm64-v8a:${projectDir}/src/main/jniLibs/armeabi-v7a:${projectDir}/src/main/jniLibs/x86:${projectDir}/src/main/jniLibs/x86_64"

                // Force Robolectric to use older API level to avoid ComplexColor issues
                systemProperty "robolectric.enabledSdks", "28"
                systemProperty "robolectric.offline", "false"
                systemProperty "robolectric.dependency.repo.url", "https://repo1.maven.org/maven2"
                systemProperty "robolectric.dependency.repo.id", "central"

                // Prevent bytecode verification issues with Jacoco instrumentation
                jvmArgs "-Xverify:none"
            }
        }
    }

    compileSdkVersion 36

    packaging {
        resources {
            excludes += ["META-INF/LICENSE.md", "META-INF/LICENSE-notice.md"]
        }
    }

    defaultConfig {
        applicationId "org.devmiyax.yabasanshioro2"
        minSdkVersion 24
        targetSdkVersion 36
        multiDexEnabled true
        versionCode 363
        versionName '1.20.46'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        signingConfig signingConfigs.pro
        buildConfigField "int", "MAX_FREE_GAMES", "3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

/*
        externalNativeBuild {

            // For ndk-build, instead use ndkBuild {}
            cmake {

                //cd  Passes optional arguments to CMake.
                arguments "-DANDROID_ABI=armeabi-v7a","-DANDROID_NATIVE_API_LEVEL=19","-DYAB_PORTS=android",
                        "-DYAB_WANT_C68K=FALSE","-DYAB_WANT_ARM7=TRUE","-DYAB_WANT_DYNAREC_DEVMIYAX=TRUE",
                        "-DANDROID_FORCE_ARM_BUILD=FALSE","-DCMAKE_BUILD_TYPE=Release"
            }
        }
        ndk {
            // Specifies the ABI configurations of your native
            // libraries Gradle should build and package with your APK.
            abiFilters 'armeabi-v7a'
        }
*/
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationVariants.all { variant ->
                renameAPK(variant, defaultConfig, 'R')
            }
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir  file("$projectDir/unstripped")
            }
            ndk{
                debugSymbolLevel 'FULL'
            }
            packagingOptions {
                jniLibs {
                    excludes += project.ext.shippedJniLibsExcludes
                }
            }
            resValue "string", "app_name", "Yaba Sanshiro 2"
        }
        pro {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationIdSuffix ".pro"
            versionNameSuffix '-PRO'
            buildConfigField 'String', 'AUTHORITY', '"org.devmiyax.yabasanshioro2.pro.contentprovider"'
            resValue "string", "app_name", "Yaba Sanshiro 2 Pro"
            applicationVariants.all { variant ->
                renameAPK(variant, defaultConfig, 'P')
            }
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir  file("$projectDir/unstripped")
            }
            ndk{
                debugSymbolLevel 'FULL'
            }
            packagingOptions {
                jniLibs {
                    excludes += project.ext.shippedJniLibsExcludes
                }
            }
        }
        debug {
            debuggable true
            testCoverageEnabled true
            applicationIdSuffix ".debug"
            versionNameSuffix '-DEBUG'
            resValue "string", "app_name", "Yaba Sanshiro 2 debug"
            buildConfigField 'String', 'AUTHORITY', '"org.devmiyax.yabasanshioro2.debug.contentprovider"'
            signingConfig signingConfigs.debug
            packagingOptions {
                doNotStrip "**/*/*.so"
            }
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                //strippedNativeLibsDir  'src/main/jniLibs'
                //unstrippedNativeLibsDir  'src/main/jniLibs'
            }

        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    buildToolsVersion '36.0.0'
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        abortOnError false
    }

/*
    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
        }
    }
*/
}

