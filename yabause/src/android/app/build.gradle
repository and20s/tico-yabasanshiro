// Jacoco code coverage configuration
jacoco {
    toolVersion = "0.8.7"  // Use version compatible with Robolectric 4.15.1
}

// Configure Android test options with Jacoco compatibility
android.testOptions.unitTests.all {
    jacoco {
        includeNoLocationClasses = true
        excludes = [
            'jdk.internal.*',
            'android/**/*',
            'androidx/**/*',
            'com.android.**/*',
            'org.robolectric.**/*',
            'android/content/res/**/*',
            'android/util/**/*',
            'android/graphics/**/*',
            '**/*$WhenMappings.*',
            '**/*$Companion.*',
            '**/*Test*.*',
            '**/*Tests*.*',
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*'
        ]
    }

    // Additional system properties to prevent bytecode verification issues
    systemProperty 'jacoco.dumpOnExit', 'false'
    systemProperty 'jacoco.output', 'file'
    systemProperty 'jacoco.append', 'true'
}

// Task to generate combined test coverage report
task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/AutoValue_*.*',
        '**/*JavascriptBridge.class',
        '**/databinding/**',
        '**/android/databinding/**',
        '**/androidx/databinding/**',
        '**/BR.class',
        '**/androidx/**'
    ]

    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def kotlinDebugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"
    def kotlinMainSrc = "${project.projectDir}/src/main/kotlin"

    sourceDirectories.setFrom(files([mainSrc, kotlinMainSrc]))
    classDirectories.setFrom(files([debugTree, kotlinDebugTree]))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/*.exec'
    ]))
}

// Task specifically for our auth package coverage
task authPackageCoverageReport(type: JacocoReport) {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
    ]

    // Focus on auth package only
    def debugTree = fileTree(
        dir: "${buildDir}/tmp/kotlin-classes/debug",
        includes: ['**/auth/**/*.class'],
        excludes: fileFilter
    )
    def authSrc = "${project.projectDir}/src/main/java/org/uoyabause/android/auth"

    sourceDirectories.setFrom(files([authSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/*.exec'
    ]))
}


