# Robolectric configuration for YabaSanshiro tests
sdk=28
qualifiers=en-rUS-w320dp-h470dp-normal-notlong-port-notnight-mdpi-finger-keysexposed-nokeys-navhidden

# Ignore native libraries to avoid UnsatisfiedLinkError
# This allows tests to run without requiring actual native libraries
application=org.uoyabause.android.TestYabauseApplication

# Configure instrumentation to avoid conflicts with Jacoco
instrumentedPackages=org.uoyabause

# Custom shadows to avoid Jacoco bytecode conflicts
shadows=org.uoyabause.android.shadows.ShadowComplexColor,org.uoyabause.android.shadows.ShadowResourcesImpl

# Dependency resolution for Robolectric
dependency.repo.url=https://repo1.maven.org/maven2
dependency.repo.id=central