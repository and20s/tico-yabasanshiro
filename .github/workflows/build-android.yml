name: Build Android APK (debug)

# Manual trigger from the Actions tab, plus every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_DIR: yabause/src/android
      ABI: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only `rcheevos` is a real submodule in this repo. oboe and the second copy of
      # rcheevos are listed in .gitmodules but not tracked, so fetch them by hand.
      - name: Fetch dependencies
        run: |
          set -e
          git submodule update --init rcheevos
          rm -rf yabause/src/retroachievements/rcheevos
          cp -r rcheevos yabause/src/retroachievements/rcheevos
          rm -rf yabause/src/retroachievements/rcheevos/.git
          rm -rf yabause/src/android/oboe
          git clone --depth 1 --branch 1.9.3 https://github.com/google/oboe yabause/src/android/oboe
          ls yabause/src/android/oboe | head -5
          ls yabause/src/retroachievements/rcheevos | head -5

      # The public source does not build for Android as-is. These small patches are applied at
      # build time (each one asserts its target text, so the build stops if upstream changes).
      #  1. memory.c: ww_check() only exists in the SH2-cache build but is always called.
      #  2. thr-linux.cpp: YabThreadIsLockedByCurrentThread() exists only in the Switch port.
      #  3. CMakeLists.txt: PlayRecorder.cpp is commented out but the Android code uses it.
      - name: Apply build fixes
        run: |
          python3 - <<'PY'
          import re

          def read(path):
              return open(path, encoding='utf-8', errors='surrogateescape', newline='').read()

          def write(path, text):
              open(path, 'w', encoding='utf-8', errors='surrogateescape', newline='').write(text)

          def replace_once(text, old, new, what):
              assert text.count(old) == 1, 'patch target not found exactly once: ' + what
              return text.replace(old, new)

          # 1) memory.c
          p = 'yabause/src/memory.c'
          s = read(p)
          nl = '\r\n' if '\r\n' in s else '\n'
          marker = '#if CACHE_ENABLE' + nl + 'void FASTCALL MappedMemoryWriteByte(u32 addr, u8 val, u32 *cycle)'
          stub = nl.join([
              '#if !CACHE_ENABLE',
              '/* Debug write-watch helper only exists in the cache build; no-op here. */',
              'static inline void ww_check(u32 addr, u32 val, int size) { (void)addr; (void)val; (void)size; }',
              '#endif', ''])
          write(p, replace_once(s, marker, stub + marker, 'memory.c'))

          # 2) thr-linux.cpp (file uses CRLF line endings)
          p = 'yabause/src/thr-linux.cpp'
          s = read(p)
          nl = '\r\n' if '\r\n' in s else '\n'
          def L(t):
              return t.replace('\n', nl)
          s = replace_once(s,
              L('  pthread_mutex_t mutex;\n} YabMutex_pthread;'),
              L('  pthread_mutex_t mutex;\n  pthread_t owner;\n  volatile int has_owner;\n} YabMutex_pthread;'),
              'YabMutex_pthread struct')
          s = replace_once(s,
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pthread_mutex_lock(&pmtx->mutex);\n}'),
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pthread_mutex_lock(&pmtx->mutex);\n    pmtx->owner = pthread_self();\n    pmtx->has_owner = 1;\n}'),
              'YabThreadLock')
          s = replace_once(s,
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pthread_mutex_unlock(&pmtx->mutex);\n}'),
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pmtx->has_owner = 0;\n    pthread_mutex_unlock(&pmtx->mutex);\n}\n\n'
                'int YabThreadIsLockedByCurrentThread( YabMutex * mtx ){\n'
                '    YabMutex_pthread * pmtx;\n'
                '    if( mtx == NULL ) return 0;\n'
                '    pmtx = (YabMutex_pthread *)mtx;\n'
                '    return ( pmtx->has_owner && pthread_equal(pmtx->owner, pthread_self()) ) ? 1 : 0;\n}'),
              'YabThreadUnLock')
          s = replace_once(s,
              L('    pthread_mutex_init( &mtx->mutex,NULL);\n    return (YabMutex *)mtx;'),
              L('    pthread_mutex_init( &mtx->mutex,NULL);\n    mtx->has_owner = 0;\n    return (YabMutex *)mtx;'),
              'YabThreadCreateMutex')
          write(p, s)

          # 3) CMakeLists.txt: enable PlayRecorder.cpp (a commented-out source line)
          p = 'yabause/src/CMakeLists.txt'
          s = read(p)
          s, n = re.subn(r'(?m)^(\t)#+PlayRecorder\.cpp[ \t]*(\r?)$', r'\1PlayRecorder.cpp\2', s)
          assert n == 1, 'PlayRecorder.cpp line not found exactly once'
          write(p, s)
          print('build fixes applied')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      # ---- 1) Native emulator core (libyabause_native.so) -------------------
      - name: Build native library
        run: |
          set -e
          # NDK 30 (runner default) is stricter than the code expects; use NDK 27.
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "Using NDK: $NDK"
          # ASM-ATT flags: clang needs -c to only assemble (GNU as does not), and CMake omits it.
          cmake -S yabause -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_ASM-ATT_COMPILER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            -DCMAKE_ASM-ATT_FLAGS="--target=aarch64-none-linux-android24 -c" \
            -DSH2_DYNAREC=OFF \
            -DYAB_PORTS=android \
            -DYAB_WANT_C68K=FALSE \
            -DYAB_WANT_ARM7=TRUE \
            -DYAB_WANT_DYNAREC_DEVMIYAX=TRUE \
            -DCMAKE_BUILD_TYPE=Release
          set +e
          # -k 0: keep compiling after an error so one run reports every failing file
          cmake --build build-native --target yabause_native -j"$(nproc)" -- -k 0 2>&1 | tee build-native.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Native build errors"
              echo '```'
              # ninja prints "FAILED: ..." then the command and its output
              awk '/^FAILED:/{c=16} c>0{print; c--}' build-native.log | cut -c1-300 | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "=== FAILED STEPS (command + output) ==="
            awk '/^FAILED:/{c=16} c>0{print; c--}' build-native.log | cut -c1-300 | head -120
            exit "$status"
          fi

      # CMake writes the library straight into jniLibs/<abi>; only copy if it ended up elsewhere.
      - name: Place native library for Gradle
        run: |
          set -e
          DEST="$ANDROID_DIR/app/src/main/jniLibs/$ABI"
          if [ -f "$DEST/libyabause_native.so" ]; then
            echo "Native library already in place"
          else
            SO=$(find . -name 'libyabause_native.so' -not -path './build-native/CMakeFiles/*' | head -n 1)
            test -n "$SO" || { echo "libyabause_native.so not found"; exit 1; }
            echo "Found: $SO"
            mkdir -p "$DEST"
            cp "$SO" "$DEST/libyabause_native.so"
          fi
          ls -la "$DEST"

      # ---- 2) Android app ---------------------------------------------------
      # build.gradle expects this keystore but it is not in the repo.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$ANDROID_DIR/debug-yabara.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summarize() {
              echo "--- What went wrong ---"
              awk '/^\* What went wrong:/{p=1} /^\* Try:/{p=0} p' "$GITHUB_WORKSPACE/gradle-build.log" | head -60
              echo "--- Compiler errors ---"
              grep -E "^e: |error:" "$GITHUB_WORKSPACE/gradle-build.log" | sort -u | head -40 | cut -c1-300
            }
            { echo "## Gradle build errors"; echo '```'; summarize; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "=== GRADLE ERROR SUMMARY ==="
            summarize
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Build logs help a lot when the first run fails.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-native.log
            gradle-build.log
            build-native/CMakeFiles/CMakeConfigureLog.yaml
            build-native/CMakeFiles/CMakeError.log
            build-native/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
