name: Build Android APK (debug)

# Manual trigger from the Actions tab, plus every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_DIR: yabause/src/android
      ABI: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only `rcheevos` is a real submodule in this repo. oboe and the second copy of
      # rcheevos are listed in .gitmodules but not tracked, so fetch them by hand.
      - name: Fetch dependencies
        run: |
          set -e
          git submodule update --init rcheevos
          rm -rf yabause/src/retroachievements/rcheevos
          cp -r rcheevos yabause/src/retroachievements/rcheevos
          rm -rf yabause/src/retroachievements/rcheevos/.git
          rm -rf yabause/src/android/oboe
          git clone --depth 1 --branch 1.9.3 https://github.com/google/oboe yabause/src/android/oboe
          ls yabause/src/android/oboe | head -5
          ls yabause/src/retroachievements/rcheevos | head -5

      # Upstream bug: ww_check() is only defined when SH2 cache emulation is on, but it is
      # called unconditionally, so a normal build fails. Add a no-op version for that case.
      - name: Apply build fixes
        run: |
          python3 - <<'PY'
          p = 'yabause/src/memory.c'
          s = open(p, encoding='utf-8', errors='surrogateescape').read()
          marker = '#if CACHE_ENABLE\nvoid FASTCALL MappedMemoryWriteByte(u32 addr, u8 val, u32 *cycle)'
          assert s.count(marker) == 1, 'memory.c layout changed, fix needs an update'
          stub = ('#if !CACHE_ENABLE\n'
                  '/* Debug write-watch helper only exists in the cache build; no-op here. */\n'
                  'static inline void ww_check(u32 addr, u32 val, int size) { (void)addr; (void)val; (void)size; }\n'
                  '#endif\n')
          open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s.replace(marker, stub + marker))
          print('memory.c patched')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      # ---- 1) Native emulator core (libyabause_native.so) -------------------
      - name: Build native library
        run: |
          set -e
          # NDK 30 (runner default) is stricter than the code expects; use NDK 27.
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "Using NDK: $NDK"
          # ASM-ATT flags: clang needs -c to only assemble (GNU as does not), and CMake omits it.
          cmake -S yabause -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_ASM-ATT_COMPILER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            -DCMAKE_ASM-ATT_FLAGS="--target=aarch64-none-linux-android24 -c" \
            -DYAB_PORTS=android \
            -DYAB_WANT_C68K=FALSE \
            -DYAB_WANT_ARM7=TRUE \
            -DYAB_WANT_DYNAREC_DEVMIYAX=TRUE \
            -DCMAKE_BUILD_TYPE=Release
          set +e
          # -k 0: keep compiling after an error so one run reports every failing file
          cmake --build build-native --target yabause_native -j"$(nproc)" -- -k 0 2>&1 | tee build-native.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Native build errors"
              echo '```'
              # ninja prints "FAILED: ..." then the command and its output
              awk '/^FAILED:/{c=16} c>0{print; c--}' build-native.log | cut -c1-300 | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "=== FAILED STEPS (command + output) ==="
            awk '/^FAILED:/{c=16} c>0{print; c--}' build-native.log | cut -c1-300 | head -120
            exit "$status"
          fi

      # The CMake file writes to jniLibs/${ANDROID_NDK_ABI_NAME}, a variable only the
      # old toolchain defined, so locate the .so and put it where Gradle expects it.
      - name: Place native library for Gradle
        run: |
          set -e
          SO=$(find . -name 'libyabause_native.so' -not -path './build-native/CMakeFiles/*' | head -n 1)
          test -n "$SO" || { echo "libyabause_native.so not found"; exit 1; }
          echo "Found: $SO"
          DEST="$ANDROID_DIR/app/src/main/jniLibs/$ABI"
          mkdir -p "$DEST"
          cp "$SO" "$DEST/libyabause_native.so"
          ls -la "$DEST"

      # ---- 2) Android app ---------------------------------------------------
      # build.gradle expects this keystore but it is not in the repo.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$ANDROID_DIR/debug-yabara.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Build logs help a lot when the first run fails.
      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            build-native.log
            build-native/CMakeFiles/CMakeConfigureLog.yaml
            build-native/CMakeFiles/CMakeError.log
            build-native/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
