name: Build Android APK (debug)

# Manual trigger from the Actions tab, plus every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_DIR: yabause/src/android
      ABI: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the submodules the Android build needs (not the retro_arena/eigen one).
      - name: Fetch required submodules
        run: |
          git submodule update --init --depth 1 \
            yabause/src/android/oboe \
            rcheevos \
            yabause/src/retroachievements/rcheevos

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6"

      # ---- 1) Native emulator core (libyabause_native.so) -------------------
      - name: Build native library
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          cmake -S yabause -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DYAB_PORTS=android \
            -DYAB_WANT_C68K=FALSE \
            -DYAB_WANT_ARM7=TRUE \
            -DYAB_WANT_DYNAREC_DEVMIYAX=TRUE \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --target yabause_native -j"$(nproc)"

      # The CMake file writes to jniLibs/${ANDROID_NDK_ABI_NAME}, a variable only the
      # old toolchain defined, so locate the .so and put it where Gradle expects it.
      - name: Place native library for Gradle
        run: |
          set -e
          SO=$(find . -name 'libyabause_native.so' -not -path './build-native/CMakeFiles/*' | head -n 1)
          test -n "$SO" || { echo "libyabause_native.so not found"; exit 1; }
          echo "Found: $SO"
          DEST="$ANDROID_DIR/app/src/main/jniLibs/$ABI"
          mkdir -p "$DEST"
          cp "$SO" "$DEST/libyabause_native.so"
          ls -la "$DEST"

      # ---- 2) Android app ---------------------------------------------------
      # build.gradle expects this keystore but it is not in the repo.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$ANDROID_DIR/debug-yabara.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Build logs help a lot when the first run fails.
      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            build-native/CMakeFiles/CMakeConfigureLog.yaml
            build-native/CMakeFiles/CMakeError.log
            build-native/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
