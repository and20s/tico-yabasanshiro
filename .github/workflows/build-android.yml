name: Build Android APK (debug)

# Manual trigger from the Actions tab, plus every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_DIR: yabause/src/android
      ABI: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only `rcheevos` is a real submodule in this repo. oboe and the second copy of
      # rcheevos are listed in .gitmodules but not tracked, so fetch them by hand.
      - name: Fetch dependencies
        run: |
          set -e
          git submodule update --init rcheevos
          rm -rf yabause/src/retroachievements/rcheevos
          cp -r rcheevos yabause/src/retroachievements/rcheevos
          rm -rf yabause/src/retroachievements/rcheevos/.git
          rm -rf yabause/src/android/oboe
          git clone --depth 1 --branch 1.9.3 https://github.com/google/oboe yabause/src/android/oboe
          ls yabause/src/android/oboe | head -5
          ls yabause/src/retroachievements/rcheevos | head -5

      # The public source does not build for Android as-is. These small patches are applied at
      # build time (each one asserts its target text, so the build stops if upstream changes).
      #  1. memory.c: ww_check() only exists in the SH2-cache build but is always called.
      #  2. thr-linux.cpp: YabThreadIsLockedByCurrentThread() exists only in the Switch port.
      #  3. CMakeLists.txt: PlayRecorder.cpp is commented out but the Android code uses it.
      - name: Apply build fixes
        run: |
          python3 - <<'PY'
          import re

          def read(path):
              return open(path, encoding='utf-8', errors='surrogateescape', newline='').read()

          def write(path, text):
              open(path, 'w', encoding='utf-8', errors='surrogateescape', newline='').write(text)

          def replace_once(text, old, new, what):
              assert text.count(old) == 1, 'patch target not found exactly once: ' + what
              return text.replace(old, new)

          # 1) memory.c
          p = 'yabause/src/memory.c'
          s = read(p)
          nl = '\r\n' if '\r\n' in s else '\n'
          marker = '#if CACHE_ENABLE' + nl + 'void FASTCALL MappedMemoryWriteByte(u32 addr, u8 val, u32 *cycle)'
          stub = nl.join([
              '#if !CACHE_ENABLE',
              '/* Debug write-watch helper only exists in the cache build; no-op here. */',
              'static inline void ww_check(u32 addr, u32 val, int size) { (void)addr; (void)val; (void)size; }',
              '#endif', ''])
          write(p, replace_once(s, marker, stub + marker, 'memory.c'))

          # 2) thr-linux.cpp (file uses CRLF line endings)
          p = 'yabause/src/thr-linux.cpp'
          s = read(p)
          nl = '\r\n' if '\r\n' in s else '\n'
          def L(t):
              return t.replace('\n', nl)
          s = replace_once(s,
              L('  pthread_mutex_t mutex;\n} YabMutex_pthread;'),
              L('  pthread_mutex_t mutex;\n  pthread_t owner;\n  volatile int has_owner;\n} YabMutex_pthread;'),
              'YabMutex_pthread struct')
          s = replace_once(s,
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pthread_mutex_lock(&pmtx->mutex);\n}'),
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pthread_mutex_lock(&pmtx->mutex);\n    pmtx->owner = pthread_self();\n    pmtx->has_owner = 1;\n}'),
              'YabThreadLock')
          s = replace_once(s,
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pthread_mutex_unlock(&pmtx->mutex);\n}'),
              L('    pmtx = (YabMutex_pthread *)mtx;\n    pmtx->has_owner = 0;\n    pthread_mutex_unlock(&pmtx->mutex);\n}\n\n'
                'int YabThreadIsLockedByCurrentThread( YabMutex * mtx ){\n'
                '    YabMutex_pthread * pmtx;\n'
                '    if( mtx == NULL ) return 0;\n'
                '    pmtx = (YabMutex_pthread *)mtx;\n'
                '    return ( pmtx->has_owner && pthread_equal(pmtx->owner, pthread_self()) ) ? 1 : 0;\n}'),
              'YabThreadUnLock')
          s = replace_once(s,
              L('    pthread_mutex_init( &mtx->mutex,NULL);\n    return (YabMutex *)mtx;'),
              L('    pthread_mutex_init( &mtx->mutex,NULL);\n    mtx->has_owner = 0;\n    return (YabMutex *)mtx;'),
              'YabThreadCreateMutex')
          write(p, s)

          # 3) CMakeLists.txt: enable PlayRecorder.cpp (a commented-out source line)
          p = 'yabause/src/CMakeLists.txt'
          s = read(p)
          s, n = re.subn(r'(?m)^(\t)#+PlayRecorder\.cpp[ \t]*(\r?)$', r'\1PlayRecorder.cpp\2', s)
          assert n == 1, 'PlayRecorder.cpp line not found exactly once'
          write(p, s)
          # 4) Placeholder AdMob ids crash the app on launch: use Google's official test ids
          p = 'yabause/src/android/app/src/main/res/values/local_security.xml'
          s = read(p)
          for name, val in [
              ('ad_app_id', 'ca-app-pub-3940256099942544~3347511713'),
              ('banner_ad_unit_id', 'ca-app-pub-3940256099942544/6300978111'),
              ('banner_ad_unit_id2', 'ca-app-pub-3940256099942544/6300978111'),
              ('game_id', '000000000000'),
          ]:
              s, n = re.subn(r'(<string name="%s"[^>]*>)[^<]*(</string>)' % name, r'\g<1>%s\g<2>' % val, s)
              assert n == 1, 'string not found: ' + name
          write(p, s)

          # 5) No jacoco instrumentation in debug builds
          p = 'yabause/src/android/app/build.gradle'
          s = read(p)
          s, n = re.subn(r'testCoverageEnabled true', 'testCoverageEnabled false', s)
          assert n == 1, 'testCoverageEnabled not found'
          write(p, s)
          # 6) Swipe to aim (HotD1): a free finger moves the aim like the stick/D-pad
          p = 'yabause/src/android/app/src/main/java/org/uoyabause/android/YabausePad.kt'
          raw = open(p, encoding='utf-8', errors='surrogateescape', newline='').read()
          crlf = '\r\n' in raw
          s = raw.replace('\r\n', '\n')
          assert 'handleSwipeAim' not in s, 'swipe patch already applied'

          def once(text, old, new, what):
              assert text.count(old) == 1, 'anchor not found exactly once: ' + what
              return text.replace(old, new)

          s = once(s, 'import android.os.Build\n',
                   'import android.os.Build\nimport android.os.Handler\nimport android.os.Looper\n', 'imports')

          fields = '''    private var dynamicAnalog: DynamicAnalogStick? = null

              // ---- Swipe to aim: a finger that starts on a free part of the screen moves the aim ----
              private var swipePointerId = -1
              private var swipeLastX = 0f
              private var swipeLastY = 0f
              private var swipeEnabled = true
              private var swipeSensitivity = 1.0f
              private val swipeHandler = Handler(Looper.getMainLooper())
              private val swipeIdle = Runnable { swipeSend(0f, 0f) }

              private fun controlOwnsPointer(id: Int): Boolean {
                  if (dpad.isOn(id)) return true
                  if (dynamicAnalog?.isTrackingPointer(id) == true) return true
                  if (analogPad?.isOn(id) == true) return true
                  for (i in 4 until PadEvent.BUTTON_LAST) {
                      if (buttons[i]?.hasPointer(id) == true) return true
                  }
                  return false
              }

              private fun swipeSend(
                  dx: Float,
                  dy: Float,
              ) {
                  if (padMode == PadManager.MODE_ANALOG) {
                      if (dynamicAnalog?.isActive() == true) return
                      val gain = 14f * swipeSensitivity
                      axiX = (128f + dx * gain).coerceIn(0f, 255f).toInt()
                      axiY = (128f + dy * gain).coerceIn(0f, 255f).toInt()
                      YabauseRunnable.axisWithDebug(PadEvent.PERANALOG_AXIS_X, 0, axiX)
                      YabauseRunnable.axisWithDebug(PadEvent.PERANALOG_AXIS_Y, 0, axiY)
                  } else {
                      if (dpad.isOn()) return
                      val thr = 1.5f / swipeSensitivity
                      actionDpadState(DpadState(dx < -thr, dx > thr, dy < -thr, dy > thr))
                  }
              }

              private fun handleSwipeAim(event: MotionEvent) {
                  if (!swipeEnabled || padTestestMode) return
                  val action = event.actionMasked
                  when (action) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val idx = event.actionIndex
                          val id = event.getPointerId(idx)
                          if (swipePointerId == -1 && !controlOwnsPointer(id)) {
                              swipePointerId = id
                              swipeLastX = event.getX(idx)
                              swipeLastY = event.getY(idx)
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (swipePointerId != -1) {
                              val idx = event.findPointerIndex(swipePointerId)
                              if (idx >= 0) {
                                  val x = event.getX(idx)
                                  val y = event.getY(idx)
                                  val dx = x - swipeLastX
                                  val dy = y - swipeLastY
                                  swipeLastX = x
                                  swipeLastY = y
                                  swipeHandler.removeCallbacks(swipeIdle)
                                  swipeSend(dx, dy)
                                  swipeHandler.postDelayed(swipeIdle, 45)
                              }
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                          val id = event.getPointerId(event.actionIndex)
                          if (swipePointerId != -1 && (action == MotionEvent.ACTION_CANCEL || id == swipePointerId)) {
                              swipeHandler.removeCallbacks(swipeIdle)
                              swipeSend(0f, 0f)
                              swipePointerId = -1
                          }
                      }
                  }
              }
          '''
          s = once(s, '    private var dynamicAnalog: DynamicAnalogStick? = null\n', fields, 'dynamicAnalog field')

          s = once(s, '        if (!padTestestMode) {\n            if (padMode == 0) {\n',
                   '        handleSwipeAim(event)\n        if (!padTestestMode) {\n            if (padMode == 0) {\n', 'onTouch tail')

          s = once(s, '    private fun handleButtonMove(\n        hittest: RectF,\n        pointerId: Int,\n    ) {\n',
                   '    private fun handleButtonMove(\n        hittest: RectF,\n        pointerId: Int,\n    ) {\n        if (pointerId == swipePointerId) return\n', 'handleButtonMove')

          s = once(s, '    private fun updateDPad(\n        hittest: RectF,\n        posx: Int,\n        posy: Int,\n        pointerId: Int,\n    ) {\n',
                   '    private fun updateDPad(\n        hittest: RectF,\n        posx: Int,\n        posy: Int,\n        pointerId: Int,\n    ) {\n        if (pointerId == swipePointerId) return\n', 'updateDPad')

          s = once(s, '        forceFeedback = sharedPref.getBoolean("pref_force_feedback", true)\n',
                   '        forceFeedback = sharedPref.getBoolean("pref_force_feedback", true)\n'
                   '        swipeEnabled = sharedPref.getBoolean("pref_swipe_aim", true)\n'
                   '        swipeSensitivity = sharedPref.getFloat("pref_swipe_sensitivity", 1.0f)\n', 'prefs')

          # While swipe-aim is on, the invisible dynamic analog stick no longer grabs touches: in analog
          # mode the whole screen is the swipe zone (the hat/D-pad mode keeps its D-pad as before).
          old = "                if (padMode == PadManager.MODE_ANALOG) {\n                    updateDynamicAnalog(posx, posy, pointerId, action)\n"
          assert s.count(old) == 2, 'expected 2 dynamic analog DOWN blocks, got %d' % s.count(old)
          s = s.replace(old, "                if (padMode == PadManager.MODE_ANALOG) {\n                    if (!swipeEnabled) updateDynamicAnalog(posx, posy, pointerId, action)\n")

          if crlf:
              s = s.replace('\n', '\r\n')
          open(p, 'w', encoding='utf-8', errors='surrogateescape', newline='').write(s)
          print('swipe aim applied')
          # 7) Game screen always landscape (and remove the lock-landscape option)
          def _edit(path, fn):
              raw = open(path, encoding='utf-8', errors='surrogateescape', newline='').read()
              crlf = '\r\n' in raw
              s = fn(raw.replace('\r\n', '\n'))
              if crlf:
                  s = s.replace('\n', '\r\n')
              open(path, 'w', encoding='utf-8', errors='surrogateescape', newline='').write(s)

          base = 'yabause/src/android/app/src/main/'

          def _kt(s):
              old = ('        val lockLandscape = sharedPref.getBoolean("pref_landscape", false)\n'
                     '        requestedOrientation =\n'
                     '            if (lockLandscape == true) {\n'
                     '                ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE\n')
              assert s.count(old) == 1, 'Yabause.kt orientation block'
              return s.replace(old, '        val lockLandscape = true\n'
                     '        requestedOrientation =\n'
                     '            if (lockLandscape == true) {\n'
                     '                ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE\n')
          _edit(base + 'java/org/uoyabause/android/Yabause.kt', _kt)

          def _xml(s):
              import re
              s2, n = re.subn(r'\n        <SwitchPreferenceCompat\n            android:key="pref_landscape"\n(?:            [^\n]*\n)*?            android:defaultValue="false" />\n', '\n', s)
              assert n == 1, 'pref_landscape preference block'
              return s2
          _edit(base + 'res/xml/preferences.xml', _xml)

          def _man(s):
              old = '            android:name="org.uoyabause.android.Yabause"\n            android:configChanges="orientation|keyboardHidden|screenSize|keyboard"\n'
              assert s.count(old) == 1, 'Yabause manifest entry'
              return s.replace(old, old + '            android:screenOrientation="sensorLandscape"\n')
          _edit(base + 'AndroidManifest.xml', _man)
          print('yaba landscape applied')
          # 8) Local "test codes" box in the settings (Action Replay codes without signing in).
          def _edit2(path, fn):
              raw = open(path, encoding='utf-8', errors='surrogateescape', newline='').read()
              crlf = '\r\n' in raw
              s = fn(raw.replace('\r\n', '\n'))
              if crlf:
                  s = s.replace('\n', '\r\n')
              open(path, 'w', encoding='utf-8', errors='surrogateescape', newline='').write(s)

          base2 = 'yabause/src/android/app/src/main/'

          def _prefs(s):
              anchor = '        <SwitchPreferenceCompat\n            android:key="pref_rotate_screen"\n'
              assert s.count(anchor) == 1, 'pref_rotate_screen anchor'
              new = ('        <EditTextPreference\n'
                     '            android:key="pref_test_cheats"\n'
                     '            android:title="Codigos de prueba (HotD)"\n'
                     '            android:summary="Codigos Action Replay, uno por linea o separados por punto y coma. Ej: 160B1076 0050. Se aplican 5 s despues de abrir el juego."\n'
                     '            android:defaultValue="" />\n\n')
              return s.replace(anchor, new + anchor)
          _edit2(base2 + 'res/xml/preferences.xml', _prefs)

          def _yab(s):
              anchor = '    public override fun onResume() {\n        super.onResume()\n'
              assert s.count(anchor) == 1, 'Yabause onResume anchor'
              func = r'''    private fun applyTestCheats() {
                  val text = PreferenceManager.getDefaultSharedPreferences(this).getString("pref_test_cheats", "") ?: ""
                  if (text.isBlank()) return
                  val codes = text.split(Regex("[\\n;]+")).map { it.trim() }.filter { it.isNotEmpty() }
                  if (codes.isEmpty()) return
                  window.decorView.postDelayed({ updateCheatCode(arrayOf<String?>(codes.joinToString("\n"))) }, 5000)
              }

          '''
              return s.replace(anchor, func + anchor + '        applyTestCheats()\n')
          _edit2(base2 + 'java/org/uoyabause/android/Yabause.kt', _yab)
          print('test cheats box applied')
          print('swipe aim step done')
          print('build fixes applied')
          # 9) Absolute aim for HotD1 (reads/writes the reticle position in game RAM)
          # Absolute aim for House of the Dead 1 (Saturn, MK-81802): swipes write the reticle position
          # straight into the game's RAM (player 1 struct at 0x060B1038: +0x4C/+0x50 screen x/y,
          # +0x54/+0x58 the same <<8, +0x44/+0x48 = x-176 / 120-y). Anything that does not look like the
          # game falls back to the normal pad-based swipe.
          def load(p):
              raw = open(p, encoding='utf-8', errors='surrogateescape', newline='').read()
              return raw, '\r\n' in raw, raw.replace('\r\n', '\n')

          def save(p, s, crlf):
              if crlf:
                  s = s.replace('\n', '\r\n')
              open(p, 'w', encoding='utf-8', errors='surrogateescape', newline='').write(s)

          def once(text, old, new, what):
              assert text.count(old) == 1, 'anchor not found exactly once: ' + what
              return text.replace(old, new)

          # ---------- native ----------
          p = 'yabause/src/android/jni/yui.cpp'
          raw, crlf, s = load(p)
          assert 'aimRead' not in s
          s = once(s, '#include "cheat.h"\n', '#include "cheat.h"\n#include "memory.h"\n', 'include memory.h')
          native = '''    static bool hotd1AimValid()
              {
                  if (HighWram == NULL) return false;
                  // first bytes of the game's main program (loaded at 0x06010000)
                  if (T2ReadLong(HighWram, 0x10000) != 0xdf12d113) return false;
                  const u32 B = 0xB1038;
                  u32 ix = T2ReadLong(HighWram, B + 0x4C), iy = T2ReadLong(HighWram, B + 0x50);
                  u32 fx = T2ReadLong(HighWram, B + 0x54), fy = T2ReadLong(HighWram, B + 0x58);
                  if (ix > 351 || iy > 239) return false;
                  if ((fx >> 8) != ix || (fy >> 8) != iy) return false;
                  return true;
              }

              jint
              Java_org_uoyabause_android_YabauseRunnable_aimRead(JNIEnv *env, jobject obj, jint axis)
              {
                  if (!hotd1AimValid()) return -1;
                  return (jint)T2ReadLong(HighWram, 0xB1038 + (axis == 0 ? 0x54 : 0x58));
              }

              void
              Java_org_uoyabause_android_YabauseRunnable_aimWrite(JNIEnv *env, jobject obj, jint fx, jint fy)
              {
                  if (!hotd1AimValid()) return;
                  if (fx < 0) fx = 0;
                  if (fx > 0x15FFF) fx = 0x15FFF;
                  if (fy < 0) fy = 0;
                  if (fy > 0xEFFF) fy = 0xEFFF;
                  const u32 B = 0xB1038;
                  u32 ix = (u32)fx >> 8, iy = (u32)fy >> 8;
                  T2WriteLong(HighWram, B + 0x54, (u32)fx);
                  T2WriteLong(HighWram, B + 0x58, (u32)fy);
                  T2WriteLong(HighWram, B + 0x4C, ix);
                  T2WriteLong(HighWram, B + 0x50, iy);
                  T2WriteLong(HighWram, B + 0x44, ix - 176);
                  T2WriteLong(HighWram, B + 0x48, 120 - iy);
              }

          '''
          s = once(s, '    void\n    Java_org_uoyabause_android_YabauseRunnable_enableFPS(', native +
                   '    void\n    Java_org_uoyabause_android_YabauseRunnable_enableFPS(', 'native insert')
          save(p, s, crlf)

          # ---------- JNI declarations ----------
          p = 'yabause/src/android/app/src/main/java/org/uoyabause/android/YabauseRunnable.kt'
          raw, crlf, s = load(p)
          s = once(s, '        @JvmStatic\n        external fun enableFPS(enable: Int)\n',
                   '        @JvmStatic\n        external fun enableFPS(enable: Int)\n\n'
                   '        @JvmStatic\n        external fun aimRead(axis: Int): Int\n\n'
                   '        @JvmStatic\n        external fun aimWrite(fx: Int, fy: Int)\n', 'kt decl')
          save(p, s, crlf)

          # ---------- pad ----------
          p = 'yabause/src/android/app/src/main/java/org/uoyabause/android/YabausePad.kt'
          raw, crlf, s = load(p)
          assert 'handleSwipeAim' in s, 'swipe patch must be applied first'
          s = once(s, '    private val swipeIdle = Runnable { swipeSend(0f, 0f) }\n',
          '''    private val swipeIdle = Runnable { swipeSend(0f, 0f) }

              // Absolute aim (HotD 1): the swipe moves the reticle by writing its position into game RAM
              private var absAimActive = false
              private var absAimX = 176f
              private var absAimY = 120f

              private fun absAimSync(): Boolean {
                  val fx = YabauseRunnable.aimRead(0)
                  val fy = YabauseRunnable.aimRead(1)
                  if (fx < 0 || fy < 0) return false
                  absAimX = fx / 256f
                  absAimY = fy / 256f
                  return true
              }

              private fun absAimMove(
                  dx: Float,
                  dy: Float,
              ) {
                  val h = if (height > 0) height.toFloat() else 1080f
                  val scale = 240f / h * swipeSensitivity
                  absAimX = (absAimX + dx * scale).coerceIn(0f, 351f)
                  absAimY = (absAimY + dy * scale).coerceIn(0f, 239f)
                  YabauseRunnable.aimWrite((absAimX * 256f).toInt(), (absAimY * 256f).toInt())
              }
          ''', 'fields')
          s = once(s, '                    swipeLastX = event.getX(idx)\n                    swipeLastY = event.getY(idx)\n',
                   '                    swipeLastX = event.getX(idx)\n                    swipeLastY = event.getY(idx)\n'
                   '                    absAimActive = absAimSync()\n', 'down')
          s = once(s, '                        swipeHandler.removeCallbacks(swipeIdle)\n                        swipeSend(dx, dy)\n                        swipeHandler.postDelayed(swipeIdle, 45)\n',
          '''                        if (absAimActive) {
                                      absAimMove(dx, dy)
                                  } else {
                                      swipeHandler.removeCallbacks(swipeIdle)
                                      swipeSend(dx, dy)
                                      swipeHandler.postDelayed(swipeIdle, 45)
                                  }
          ''', 'move')
          s = once(s, '                    swipeHandler.removeCallbacks(swipeIdle)\n                    swipeSend(0f, 0f)\n                    swipePointerId = -1\n',
                   '                    swipeHandler.removeCallbacks(swipeIdle)\n                    if (!absAimActive) swipeSend(0f, 0f)\n                    absAimActive = false\n                    swipePointerId = -1\n', 'up')
          save(p, s, crlf)
          print('absolute aim applied')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      # ---- 1) Native emulator core (libyabause_native.so) -------------------
      - name: Build native library
        run: |
          set -e
          # NDK 30 (runner default) is stricter than the code expects; use NDK 27.
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "Using NDK: $NDK"
          # ASM-ATT flags: clang needs -c to only assemble (GNU as does not), and CMake omits it.
          cmake -S yabause -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_ASM-ATT_COMPILER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            -DCMAKE_ASM-ATT_FLAGS="--target=aarch64-none-linux-android24 -c" \
            -DSH2_DYNAREC=OFF \
            -DYAB_PORTS=android \
            -DYAB_WANT_C68K=FALSE \
            -DYAB_WANT_ARM7=TRUE \
            -DYAB_WANT_DYNAREC_DEVMIYAX=TRUE \
            -DCMAKE_BUILD_TYPE=Release
          set +e
          # -k 0: keep compiling after an error so one run reports every failing file
          cmake --build build-native --target yabause_native -j"$(nproc)" -- -k 0 2>&1 | tee build-native.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Native build errors"
              echo '```'
              # ninja prints "FAILED: ..." then the command and its output
              awk '/^FAILED:/{c=16} c>0{print; c--}' build-native.log | cut -c1-300 | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "=== FAILED STEPS (command + output) ==="
            awk '/^FAILED:/{c=16} c>0{print; c--}' build-native.log | cut -c1-300 | head -120
            exit "$status"
          fi

      # CMake writes the library straight into jniLibs/<abi>; only copy if it ended up elsewhere.
      - name: Place native library for Gradle
        run: |
          set -e
          DEST="$ANDROID_DIR/app/src/main/jniLibs/$ABI"
          if [ -f "$DEST/libyabause_native.so" ]; then
            echo "Native library already in place"
          else
            SO=$(find . -name 'libyabause_native.so' -not -path './build-native/CMakeFiles/*' | head -n 1)
            test -n "$SO" || { echo "libyabause_native.so not found"; exit 1; }
            echo "Found: $SO"
            mkdir -p "$DEST"
            cp "$SO" "$DEST/libyabause_native.so"
          fi
          ls -la "$DEST"

      # ---- 2) Android app ---------------------------------------------------
      # build.gradle expects this keystore but it is not in the repo.
      - name: Create debug keystore
        run: |
          # Fixed debug signing key: every build has the same signature, so a new APK installs over the old one.
          echo '' | base64 -d > "$ANDROID_DIR/debug-yabara.keystore"

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          # gradlew is checked in with Windows (CRLF) line endings, which breaks its shebang on Linux.
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summarize() {
              echo "--- What went wrong ---"
              awk '/^\* What went wrong:/{p=1} /^\* Try:/{p=0} p' "$GITHUB_WORKSPACE/gradle-build.log" | head -60
              echo "--- Compiler errors ---"
              grep -E "^e: |error:" "$GITHUB_WORKSPACE/gradle-build.log" | sort -u | head -40 | cut -c1-300
            }
            { echo "## Gradle build errors"; echo '```'; summarize; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "=== GRADLE ERROR SUMMARY ==="
            summarize
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Build logs help a lot when the first run fails.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-native.log
            gradle-build.log
            build-native/CMakeFiles/CMakeConfigureLog.yaml
            build-native/CMakeFiles/CMakeError.log
            build-native/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
